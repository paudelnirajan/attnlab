# Model registry — data, not code. Adding a model here is the only change
# needed to add it to the app; nothing in Python should hardcode a model
# name outside of tests.
#
# tier:
#   baked    - pre-downloaded into the deploy image; instant on cold start
#   lazy     - pulled from the Hub on first request
#   disabled - too large / gated / not ready; shown greyed-out with `reason`
#
# est_ram_mb: for the first four models below, this is now a MEASURED
# number — Mode B (Docker, --cpus=2 --memory=6g, isolated subprocess per
# model), from bench_results/RESULTS.md, 2026-09-19. It is
# `net_rss_delta_mb`: resident memory for that model loaded FIRST in a
# fresh process, which includes a one-time ~500-900MB transformers/
# tokenizers import cost (see docs/03-decisions.md D8) on top of the
# model's own weights. Deliberately conservative for LRU admission
# (D8's amendment) — safer to overestimate than to repeat the OOM this
# number's absence caused during Stage 0a benchmarking.

- id: attn-only-2l-demo
  label: "Attn-Only 2L (ARENA 1.2)"
  tl_name: attn-only-2l-demo
  tier: baked
  max_seq: 512
  languages: [en]
  est_ram_mb: 757
  n_layers: 2
  n_heads: 8
  d_model: 512
  n_params: 54159461
  blurb: "Two attention layers, no MLPs. The ARENA 1.2 induction-heads workhorse."

