# Model registry — data, not code. Adding a model here is the only change
# needed to add it to the app; nothing in Python should hardcode a model
# name outside of tests.
#
# tier:
#   baked    - loaded at startup when MI_PRELOAD=1; instant for the first user
#   lazy     - loaded on first request (weights are already on disk: the
#              server runs offline and scripts/fetch_models.py downloads every
#              enabled model at deploy time, D18)
#   disabled - not ready; shown greyed-out with `reason`. A model whose
#              load peak doesn't fit MI_RAM_BUDGET_GB is also refused and shown
#              disabled, automatically (zoo.py) — a safety net, not a way to
#              list big models.
#
# est_ram_mb / load_extra_mb: MEASURED with scripts/measure_model.py
# (2026-09-27, Apple M4 Pro, CPU, float32, MallocLargeCache=0, 6 threads), +10%
# and rounded up to 50 MB. est_ram_mb is what stays resident once loaded;
# load_extra_mb is held on top of it only while loading (the raw checkpoint
# and the processed copy side by side, D17). Neither includes the ~350 MB the
# Python process itself costs, which is paid once. Memory transfers between
# Apple Silicon Macs; re-measure before trusting these on Linux (glibc's
# allocator behaves differently), and re-measure any model you add:
#
#   MallocLargeCache=0 uv run python scripts/measure_model.py <tl_name>

- id: attn-only-2l-demo
  label: "Attn-Only 2L (ARENA 1.2)"
  tl_name: attn-only-2l-demo
  tier: baked
  max_seq: 512
  languages: [en]
  est_ram_mb: 250
  load_extra_mb: 250
  n_layers: 2
  n_heads: 8
  d_model: 512
  n_params: 54159461
  blurb: "Two attention layers, no MLPs. The ARENA 1.2 induction-heads workhorse."

