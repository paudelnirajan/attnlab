# Deliberately small models only. Everything here must load within the 16 GB
# server's MI_RAM_BUDGET_GB (7 GB) with room to spare. bloom-560m was removed
# on 2026-09-27: it needs ~8.6 GB while loading (a 250k-token vocabulary). The
# zoo still refuses any entry whose load peak exceeds the budget, as a safety
# net, but don't add models that rely on it.

# Qwen3-0.6B-Base: the newest, smallest Qwen that TransformerLens 2.18 supports.
# (Qwen3.5 isn't in its model table, and its hybrid linear-attention layers
# don't produce an attention pattern for most layers anyway.) Base rather than
# the chat-tuned Qwen/Qwen3-0.6B, because the labs read next-token predictions
# on plain text. n_params counts the embedding and unembedding separately:
# TransformerLens unties them.
- id: qwen3-0.6b
  label: "Qwen3 0.6B (base)"
  tl_name: Qwen/Qwen3-0.6B-Base
  tier: lazy
  max_seq: 512
  languages: [en, zh, es, fr, ar, hi, ne, ja, "and 111 more"]
  est_ram_mb: 3400
  load_extra_mb: 2650
  n_layers: 28
  n_heads: 16
  d_model: 1024
  n_params: 751984000
  blurb: "A 2025 model: 28 layers, RMSNorm, rotary positions, grouped-query attention, 119 languages."
