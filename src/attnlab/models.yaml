# bloom-560m: NOT Mode-B-verified. Its resident weight size alone
# (~6.2GB, from a native/MPS isolated measurement) exceeds this dev
# machine's real local Docker ceiling (6GB — Docker Desktop's VM here is
# fixed at 7.7GB total, a systemwide setting left unchanged by choice;
# see docs/03-decisions.md D1 amendment). tier stays `lazy` because that
# is a PRODUCTION decision against the real deploy target's RAM, which
# this dev machine cannot decide — but do not trust it in an actual
# deployment until confirmed on a bigger box. Qwen2.5-0.5B (see
# docs/PLAN.md Stage 3) is the safer default multilingual candidate
# until then.
- id: bloom-560m
  label: "BLOOM 560M"
  tl_name: bloom-560m
  tier: lazy
  max_seq: 512
  languages: [en, fr, es, zh, ar, hi, pt, vi, "and 38 more"]
  est_ram_mb: 6250  # native/MPS isolated measurement, NOT Mode B — see comment above
  n_layers: 24
  n_heads: 16
  d_model: 1024
  n_params: 818363392
  blurb: "46-language multilingual model. Used to probe cross-lingual tokenization and induction."
