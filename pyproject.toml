[project]
name = "attnlab"
version = "0.1.0"
description = "Interactive attention/induction-head playground on TransformerLens"
requires-python = ">=3.11,<3.12"
dependencies = [
    "transformer-lens==2.18.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # grapheme clusters (\X) and \p{Script=...} for the tokenizer lab; already
    # in the tree via transformers, declared because toklab.py imports it.
    "regex>=2024.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attnlab"]
